<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5c96e">
<title>Memorial - Grupo Anterior</title>
<style>
body{font-family:system-ui,sans-serif;background:#fdf6e3;color:#2a2a2a;margin:0;padding-bottom:100px;}
.hero{background:linear-gradient(135deg,#1e4d8b,#f5c96e);color:#fff;text-align:center;padding:55px 20px;}
.hero h1{font-family:Georgia,serif;font-size:2rem;margin:0;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.2);}
.tarjeta{background:#fff;border-radius:22px;padding:28px 22px;margin:20px 16px;box-shadow:0 8px 25px rgba(245,201,110,.25);border-top:5px solid #f5c96e;}
.pista{display:flex;gap:12px;padding:0 16px;overflow-x:auto;}
.pista img{flex:0 0 85%;width:100%;height:260px;object-fit:cover;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.15);display:block;}
.pie{position:absolute;bottom:0;left:0;right:0;padding:28px 14px 12px;background:linear-gradient(transparent,#1e4d8b);color:#fff;font-size:1.1rem;font-weight:bold;}
.audio-box{margin:20px 16px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 15px rgba(0,0,0,.1);}
.boton{position:fixed;bottom:0;left:0;right:0;background:#f5c96e;color:#1e4d8b;text-align:center;padding:16px;font-weight:bold;text-decoration:none;font-size:1.05rem;box-shadow:0 -2px 10px rgba(245,201,110,.4);}
</style>
</head>
<body>

<header class="hero">
  <h1>En memoria de nuestra comunidad</h1>
  <p>Un tiempo de compartir, orar y recordar con alegría.</p>
</header>

<main style="max-width:480px;margin:0 auto;">
  <article class="tarjeta">
    <h2 style="color:#1e4d8b;font-family:Georgia;">Reflexión</h2>
    <p>Guardamos cada paso juntos. La alegría de haber caminado en comunidad no se olvida.</p>
  </article>

  <div class="audio-box">
    <audio controls src="audio-ensenanza.mp3" style="width:100%;border-radius:12px;">
      Tu navegador no soporta audio.
    </audio>
    <p style="font-size:.8rem;color:#777;margin-top:8px;">Enseñanza bíblica de nuestro grupo</p>
  </div>

  <section>
    <h2 style="padding:0 20px;color:#1e4d8b;font-family:Georgia;">Momentos</h2>
    <div class="pista">
      <figure style="position:relative;flex:0 0 85%;">
        <img src="foto1.png" alt="Reunión" style="width:100%;height:260px;object-fit:cover;border-radius:18px;">
        <figcaption class="pie">Reunión del grupo</figcaption>
      </figure>
      <figure style="position:relative;flex:0 0 85%;">
        <img src="foto2.png" alt="Oración" style="width:100%;height:260px;object-fit:cover;border-radius:18px;">
        <figcaption class="pie">Tiempo de oración</figcaption>
      </figure>
      <figure style="position:relative;flex:0 0 85%;">
        <img src="foto3.png" alt="Servicio" style="width:100%;height:260px;object-fit:cover;border-radius:18px;">
        <figcaption class="pie">Servicio juntos</figcaption>
      </figure>
    </div>
  </section>
</main>

<a href="#" class="boton" onclick="history.back();">← Regresar</a>

</body>
</html>
